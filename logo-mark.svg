  <rect x="46.5" y="32" width="4.5" height="16" rx="1.2" fill="#C8F542"/>
  <rect x="53" y="25" width="4.5" height="23" rx="1.2" fill="#D9FF6A"/>

  <!-- Tiny ball node on tallest bar -->
  <circle cx="55.25" cy="22" r="3.2" fill="none" stroke="#F2F7F3" stroke-width="1.8"/>
  <path
    d="M53.4 21.2c.7.5 1.6.8 2.5.8.5 0 1-.1 1.4-.3M54.2 23.6c.6-.6 1.3-1 2.1-1.1"
