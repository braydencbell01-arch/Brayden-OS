name: Deploy PlateQuest

# PlateQuest is its own product and GitHub Pages site — never publish into
# BrayStats (Brayden-OS root) or Jersey Deals (/jerseydeals/ or jerseydeals.online).
# Live: https://braydencbell01-arch.github.io/PlateQuest/

on:
  push:
    branches:
      - Brayden-OS
    paths:
      - 'platequest/**'
      - '.github/workflows/deploy-platequest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platequest-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy token
        id: token
        env:
          PQ: ${{ secrets.PLATEQUEST_DEPLOY_TOKEN }}
          JD: ${{ secrets.JERSEYDEALS_DEPLOY_TOKEN }}
        run: |
          if [ -n "$PQ" ]; then
            echo "which=pq" >> "$GITHUB_OUTPUT"
            echo "Using PLATEQUEST_DEPLOY_TOKEN."
          elif [ -n "$JD" ]; then
            echo "which=jd" >> "$GITHUB_OUTPUT"
            echo "Using JERSEYDEALS_DEPLOY_TOKEN (PAT fallback for braydencbell01-arch/PlateQuest)."
          else
            echo "ERROR: Set PLATEQUEST_DEPLOY_TOKEN or JERSEYDEALS_DEPLOY_TOKEN." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platequest/package-lock.json

      - name: Require braydencbell01-arch/PlateQuest repo
        env:
          GH_TOKEN: ${{ steps.token.outputs.which == 'pq' && secrets.PLATEQUEST_DEPLOY_TOKEN || secrets.JERSEYDEALS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/braydencbell01-arch/PlateQuest" --silent 2>/dev/null; then
            echo "braydencbell01-arch/PlateQuest found."
            exit 0
          fi
          echo "::error::Create an empty public repo braydencbell01-arch/PlateQuest (no README), then re-run this workflow."
          echo "https://github.com/new?owner=braydencbell01-arch&name=PlateQuest&visibility=public"
          exit 1

      - name: Build PlateQuest (project Pages base /PlateQuest/)
        working-directory: platequest
        env:
          PLATEQUEST_BASE: /PlateQuest/
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          if ! grep -q 'PlateQuest' dist/index.html; then
            echo "ERROR: dist/index.html is not PlateQuest" >&2
            exit 1
          fi

      - name: Deploy to braydencbell01-arch/PlateQuest Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ steps.token.outputs.which == 'pq' && secrets.PLATEQUEST_DEPLOY_TOKEN || secrets.JERSEYDEALS_DEPLOY_TOKEN }}
          external_repository: braydencbell01-arch/PlateQuest
          publish_dir: ./platequest/dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Enable GitHub Pages on braydencbell01-arch/PlateQuest
        env:
          GH_TOKEN: ${{ steps.token.outputs.which == 'pq' && secrets.PLATEQUEST_DEPLOY_TOKEN || secrets.JERSEYDEALS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/braydencbell01-arch/PlateQuest/pages" --silent 2>/dev/null; then
            echo "Pages already configured."
            exit 0
          fi
          gh api -X POST "repos/braydencbell01-arch/PlateQuest/pages" \
            -f build_type=legacy \
            -f 'source[branch]=gh-pages' \
            -f 'source[path]=/' \
            || true

      - name: Verify live PlateQuest URL
        run: |
          set -euo pipefail
          url="https://braydencbell01-arch.github.io/PlateQuest/"
          echo "Waiting for $url …"
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            code=$(curl -sL -o /tmp/pq-live.html -w "%{http_code}" "$url" || true)
            if [[ "$code" == "200" ]] && grep -q 'PlateQuest' /tmp/pq-live.html; then
              echo "Live: $url"
              exit 0
            fi
            sleep 15
          done
          echo "Deploy pushed; Pages may still be propagating: $url"
          exit 0
