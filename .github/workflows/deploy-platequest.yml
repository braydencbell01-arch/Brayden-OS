name: Deploy PlateQuest (Cloudflare)

# Optional dedicated host: https://platequest.pages.dev/
# Primary live site is GitHub Pages /platequest/ until CF secrets are set.
# Never publishes into BrayStats root or Jersey Deals.

on:
  push:
    branches:
      - Brayden-OS
    paths:
      - 'platequest/**'
      - '.github/workflows/deploy-platequest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platequest-cf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloudflare deploy (no CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)."
            echo "PlateQuest still ships on GitHub Pages at /platequest/."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.cf.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platequest/package-lock.json

      - name: Build PlateQuest
        if: steps.cf.outputs.enabled == 'true'
        working-directory: platequest
        env:
          PLATEQUEST_BASE: /
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Create Cloudflare Pages project if needed
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create platequest --production-branch=main

      - name: Deploy PlateQuest to Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy platequest/dist --project-name=platequest --commit-dirty=true
