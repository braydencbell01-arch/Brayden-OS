name: Deploy PlateQuest

# PlateQuest is its own Cloudflare Pages site — not BrayStats, not Jersey Deals.
# Live: https://platequest.pages.dev/

on:
  push:
    branches:
      - Brayden-OS
    paths:
      - 'platequest/**'
      - '.github/workflows/deploy-platequest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platequest-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID required to publish PlateQuest." >&2
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platequest/package-lock.json

      - name: Build PlateQuest
        working-directory: platequest
        env:
          PLATEQUEST_BASE: /
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          if ! grep -q 'PlateQuest' dist/index.html; then
            echo "ERROR: dist/index.html is not PlateQuest" >&2
            exit 1
          fi

      - name: Create Cloudflare Pages project if needed
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create platequest --production-branch=main

      - name: Deploy PlateQuest to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy platequest/dist --project-name=platequest --commit-dirty=true

      - name: Verify live PlateQuest URL
        run: |
          set -euo pipefail
          url="https://platequest.pages.dev/"
          echo "Waiting for $url …"
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            code=$(curl -sL -o /tmp/pq-live.html -w "%{http_code}" "$url" || true)
            if [[ "$code" == "200" ]] && grep -q 'PlateQuest' /tmp/pq-live.html; then
              echo "Live: $url"
              exit 0
            fi
            sleep 10
          done
          echo "Deploy finished; CDN may still be propagating: $url"
          exit 0
