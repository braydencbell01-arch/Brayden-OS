name: Send Jersey Deals non-member Rewards invite

# One-shot / repeatable invite to everyone on the non-member list.
# Runs when the commit message contains [send-nonmember-invite],
# or via workflow_dispatch.

on:
  push:
    branches: [Brayden-OS]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print payload only (do not send)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: send-jerseydeals-nonmember-invite
  cancel-in-progress: false

jobs:
  send:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[send-nonmember-invite]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Brayden-OS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install nodemailer
        run: npm install --no-save nodemailer@6

      - name: Send Rewards invite to non-members
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          AUDIENCE: non_members
          SUBJECT: Quick note from Jersey Deals
          PLAIN_TEXT_ONLY: '1'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          BODY: |
            Hey —

            Noticed you’d checked out Jersey Deals but haven’t joined Rewards yet.

            It’s free. Members get early offers, restock alerts, and member-only drops from live inventory.

            Join here when you have a minute:
            https://JerseyDeals.online/#rewards

            After you join, offers show up under My offers — activate them in your cart at checkout.

            Thanks,
            Brayden
            Jersey Deals
            https://JerseyDeals.online/
            shop@jerseydeals.online
        run: |
          set -euo pipefail
          if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ]; then
            echo "Missing SMTP_USER/SMTP_PASS" >&2
            exit 1
          fi
          node jerseydeals/scripts/send-smtp-email.mjs
