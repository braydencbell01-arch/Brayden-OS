name: Push listings to Square

# Imports jerseydeals/public/listings.json into Square Catalog (items, prices, stock, images).
# Requires Actions secrets: SQUARE_ACCESS_TOKEN (optional SQUARE_LOCATION_ID, SQUARE_ENVIRONMENT)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jerseydeals-push-square
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Brayden-OS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jerseydeals/package-lock.json

      - name: Push listings.json → Square Catalog
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
        run: npm run push:square

      - name: Hint
        run: |
          echo "If push succeeded, run workflow 'Sync Jersey Deals inventory' next so the site pulls Square stock."
