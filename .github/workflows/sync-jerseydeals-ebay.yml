name: Sync Jersey Deals eBay listings

# Keeps jerseydeals/public/listings.json fresh so the storefront mirrors live inventory.
# Requires repo Actions secrets: EBAY_APP_ID, EBAY_CERT_ID, EBAY_DEV_ID, EBAY_USER_TOKEN

on:
  schedule:
    # Twice daily (UTC) — enough for one-of-one inventory without hammering the API
    - cron: '15 14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: jerseydeals-ebay-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Brayden-OS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jerseydeals/package-lock.json

      - name: Sync active listings
        working-directory: jerseydeals
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
        run: npm run sync:ebay

      - name: Commit if inventory changed
        id: commit
        run: |
          if git diff --quiet -- jerseydeals/public/listings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No inventory changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jerseydeals/public/listings.json
          git commit -m "chore(jerseydeals): sync live eBay listings"
          git push origin HEAD:Brayden-OS
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy GitHub Pages" --ref Brayden-OS
