name: Sync Jersey Deals inventory

# Prefers Square Catalog when SQUARE_* secrets exist; otherwise eBay.
# Reconciles sales from Square orders / qty-0 AND eBay SoldList, then delists
# on Square + eBay + Jersey Deals so a sale on one channel clears the others.
# Also syncs NEW listings + updates across eBay ↔ Square (SKU ebay:{itemId}).
# Cross-platform + eBay-details steps no-op (skip) when EBAY_* repo secrets are unset.
# Writes listings.json / sold-out.json / checkout-links.json and redeploys Pages when changed.
# After sync: queues brand-new kits and emails Rewards members at most once/day.

on:
  schedule:
    # Full catalog sync. Sold delist also has a dedicated lean workflow
    # (reconcile-jerseydeals-sold.yml) because GitHub often delays this cron by hours.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Shared with reconcile-jerseydeals-sold so sold + catalog commits do not race.
  group: jerseydeals-catalog-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Brayden-OS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jerseydeals/package-lock.json

      - name: Install + sold-inventory regression tests
        working-directory: jerseydeals
        run: |
          npm ci
          npm run test:sold-rules

      - name: Reconcile sold inventory (Square + eBay + site)
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
          RECONCILE_FULL_DELIST: '0'
          RECONCILE_MAX_DELIST: '3'
        run: npm run reconcile:sold

      - name: Sync new listings + updates across eBay ↔ Square
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
        run: npm run sync:cross-platform

      - name: Sync remaining inventory (Square preferred, eBay fallback)
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
        run: npm run sync:inventory

      - name: Ensure Payment Links for any new Square items
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
        run: npm run square:buyable-checkout

      - name: Ensure first-buyer discount Payment Links
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
        run: npm run square:first10-links

      - name: Ensure 2-item cart Checkout all Payment Links
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
        run: npm run square:cart-combo-links

      - name: Sync Rewards member / non-member email lists
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
        run: npm run sync:email-lists

      - name: Re-apply sold filter after sync
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
          RECONCILE_FULL_DELIST: '0'
          RECONCILE_MAX_DELIST: '3'
        run: npm run reconcile:sold

      - name: Sync eBay description + condition onto Square / listings
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
        run: npm run sync:ebay-details

      # Queue newly listed kits and email Rewards members at most once/day
      # (America/New_York). First run bootstraps known ids with no email.
      - name: Install nodemailer for Rewards digest
        run: npm install --no-save nodemailer@6

      - name: Notify Rewards members of new listings (max 1x/day)
        working-directory: jerseydeals
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: npm run email:notify-new-listings

      - name: Notify Rewards members of new offers (max 1x/day)
        working-directory: jerseydeals
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: npm run email:notify-new-offers

      # Thank-you email for each new completed Square order (bootstraps once, no blast).
      - name: Notify buyers of completed orders (thank-you)
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: npm run email:notify-order-thanks

      - name: Commit if inventory changed
        id: commit
        run: |
          git add \
            jerseydeals/public/listings.json \
            jerseydeals/public/sold-out.json \
            jerseydeals/public/checkout-links.json \
            jerseydeals/public/cart-combo-links.json \
            jerseydeals/public/reconcile-exceptions.json \
            jerseydeals/public/reconcile-applied-sales.json \
            jerseydeals/public/purchasers.json \
            jerseydeals/public/rewards-members.json \
            jerseydeals/public/non-member-emails.json \
            jerseydeals/public/rewards-new-listings-state.json \
            jerseydeals/public/rewards-offers-catalog.json \
            jerseydeals/public/rewards-new-offers-state.json \
            jerseydeals/public/order-thanks-state.json \
            jerseydeals/src/rewardsOffersCatalog.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No inventory changes."
            git reset HEAD
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(jerseydeals): sync live inventory + email lists"
          git push origin HEAD:Brayden-OS
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy GitHub Pages" --ref Brayden-OS
