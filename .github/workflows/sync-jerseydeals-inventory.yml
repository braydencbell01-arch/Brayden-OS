name: Sync Jersey Deals inventory

# Prefers Square Catalog when SQUARE_* secrets exist; otherwise eBay.
# Writes jerseydeals/public/listings.json and redeploys Pages when changed.

on:
  schedule:
    - cron: '15 14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: jerseydeals-inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Brayden-OS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jerseydeals/package-lock.json

      - name: Sync inventory (Square preferred, eBay fallback)
        working-directory: jerseydeals
        env:
          # Square (preferred)
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          # eBay fallback
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
        run: npm run sync:inventory

      - name: Commit if inventory changed
        id: commit
        run: |
          if git diff --quiet -- jerseydeals/public/listings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No inventory changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jerseydeals/public/listings.json
          git commit -m "chore(jerseydeals): sync live inventory"
          git push origin HEAD:Brayden-OS
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy GitHub Pages" --ref Brayden-OS
