name: Sync Jersey Deals inventory

# Prefers Square Catalog when SQUARE_* secrets exist; otherwise eBay.
# Reconciles sales from Square orders / qty-0 AND eBay SoldList, then delists
# on Square + eBay + Jersey Deals so a sale on one channel clears the others.
# Writes listings.json / sold-out.json / checkout-links.json and redeploys Pages when changed.

on:
  schedule:
    # Every 10 minutes — sold kits should leave all channels quickly.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: jerseydeals-inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Brayden-OS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jerseydeals/package-lock.json

      - name: Reconcile sold inventory (Square + eBay + site)
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
        run: npm run reconcile:sold

      - name: Sync remaining inventory (Square preferred, eBay fallback)
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
        run: npm run sync:inventory

      - name: Re-apply sold filter after sync
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_STORE_URL: ${{ secrets.SQUARE_STORE_URL }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
        run: npm run reconcile:sold

      - name: Sync eBay description + condition onto Square / listings
        working-directory: jerseydeals
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
        run: npm run sync:ebay-details

      - name: Commit if inventory changed
        id: commit
        run: |
          if git diff --quiet -- \
            jerseydeals/public/listings.json \
            jerseydeals/public/sold-out.json \
            jerseydeals/public/checkout-links.json \
            jerseydeals/public/reconcile-exceptions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No inventory changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jerseydeals/public/listings.json \
            jerseydeals/public/sold-out.json \
            jerseydeals/public/checkout-links.json \
            jerseydeals/public/reconcile-exceptions.json
          git commit -m "chore(jerseydeals): sync live inventory + listing details"
          git push origin HEAD:Brayden-OS
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy GitHub Pages" --ref Brayden-OS
