name: Collect Jersey Deals email

# Creates/updates a Square Customer for each lead and appends to permanent lists:
#   jerseydeals/public/rewards-members.json
#   jerseydeals/public/non-member-emails.json
# Trigger: repository_dispatch type `jerseydeals-email`
#   client_payload: { email, source, membership?, secret }
# Or workflow_dispatch for manual tests.

on:
  repository_dispatch:
    types: [jerseydeals-email]
  workflow_dispatch:
    inputs:
      email:
        description: Email to upsert as Square Customer
        required: true
        type: string
      source:
        description: Lead source label
        required: false
        default: manual
        type: string
      membership:
        description: member or non_member (blank = infer from source)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Brayden-OS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upsert Square Customer + permanent email lists
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          COLLECT_SECRET: ${{ secrets.JD_EMAIL_COLLECT_SECRET }}
          EMAIL: ${{ github.event.client_payload.email || inputs.email }}
          SOURCE: ${{ github.event.client_payload.source || inputs.source || 'manual' }}
          MEMBERSHIP: ${{ github.event.client_payload.membership || inputs.membership || '' }}
          PAYLOAD_SECRET: ${{ github.event.client_payload.secret }}
        working-directory: jerseydeals
        run: |
          set -euo pipefail
          if [ -z "${SQUARE_ACCESS_TOKEN:-}" ]; then
            echo "Missing SQUARE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [ -n "${COLLECT_SECRET:-}" ] && [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            if [ "${PAYLOAD_SECRET:-}" != "${COLLECT_SECRET}" ]; then
              echo "Invalid collect secret" >&2
              exit 1
            fi
          fi
          if [ -z "${EMAIL:-}" ]; then
            echo "Missing email" >&2
            exit 1
          fi
          node scripts/collect-email.mjs
          npm run sync:email-lists

      - name: Commit email lists if changed
        run: |
          if git diff --quiet -- \
            jerseydeals/public/rewards-members.json \
            jerseydeals/public/non-member-emails.json; then
            echo "No email-list changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jerseydeals/public/rewards-members.json \
            jerseydeals/public/non-member-emails.json
          git commit -m "chore(jerseydeals): update Rewards member / non-member email lists"
          git push origin HEAD:Brayden-OS
