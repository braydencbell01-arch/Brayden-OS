name: Deploy Brayden Stats to jerseydeals/

on:
  push:
    branches:
      - Brayden-OS
      - cursor/calendar-range-today-button-30ef
      - cursor/deploy-to-jerseydeals-url-30ef
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jerseydeals-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deploy to gh-pages/jerseydeals
        env:
          GIT_AUTHOR_NAME: Brayden Stats Deploy
          GIT_AUTHOR_EMAIL: deploy@brayden-stats.local
          GIT_COMMITTER_NAME: Brayden Stats Deploy
          GIT_COMMITTER_EMAIL: deploy@brayden-stats.local
        run: bash scripts/deploy-gh-pages.sh
